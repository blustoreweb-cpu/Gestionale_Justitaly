function toast(msg, ok = false) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast" + (ok ? " ok" : ""); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
const HUES = [142, 200, 265, 20, 330, 45, 175, 5];
function storeHue(name) { let h = 0; for (const c of String(name).toLowerCase().trim()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }
function applyTheme(store) {
  const r = document.documentElement.style, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  if (!store) { ["--accent", "--accent-d", "--g1"].forEach(k => r.removeProperty(k)); return; }
  const h = storeHue(store);
  r.setProperty("--accent", `hsl(${h} 70% ${dark ? 55 : 40}%)`);
  r.setProperty("--accent-d", `hsl(${h} 72% ${dark ? 44 : 31}%)`);
  r.setProperty("--g1", `hsla(${h} 85% 52% / .30)`);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = `hsl(${h} 70% 40%)`;
}
function budgetHtml() {
  const b = Number(pref.get("budget", 0)), t = tripTotal();
  if (!b) return `<div class="budget" style="text-align:center"><button class="chip" id="bud" style="border:0;cursor:pointer">🎯 Imposta un budget</button></div>`;
  const pct = Math.min(100, t / b * 100), cls = t > b ? "over" : t >= b * .8 ? "warn" : "";
  return `<div class="budget ${cls}" id="budw"><div class="row mute"><span class="sp">🎯 Budget ${eur(b)}</span><b>${t > b ? "sforato di " + eur(t - b) : "restano " + eur(b - t)}</b></div><div class="tr"><div class="fl" style="width:${pct}%"></div></div><div style="text-align:center;margin-top:6px"><button class="chip" id="bud" style="border:0;cursor:pointer">modifica</button></div></div>`;
}
function askBudget() {
  const cur = pref.get("budget", 0);
  const v = prompt("Budget per questa spesa in € (0 per toglierlo)", cur || "");
  if (v === null) return;
  pref.set("budget", Math.max(0, num(v))); render();
}
function budgetCheck(before, after) {
  const b = Number(pref.get("budget", 0)); if (!b || after <= before) return false;
  if (before <= b && after > b) { sfx("warn"); toast(`⚠️ Budget superato di ${eur(after - b)}`); return true; }
  if (before < b * .8 && after >= b * .8) { sfx("warn"); toast(`Hai usato l'${Math.round(after / b * 100)}% del budget`); return true; }
  return false;
}

// ---------- avvio ----------
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "INITIAL_SESSION" || ev === "SIGNED_IN" || ev === "SIGNED_OUT") setTimeout(() => boot(session), 0);
});

async function boot(session) {
  S.user = session?.user || null;
  if (!S.user) { stopRt(); return renderAuth(); }
  root().innerHTML = `<div class="wrap"><p class="mute">Carico…</p></div>`;
  const { data: m } = await sb.from("members").select("household_id,display_name,households(name,invite_code)").eq("user_id", S.user.id).limit(1).maybeSingle();
  if (!m) return renderHousehold();
  S.me = m; S.hh = m.households;
  const { data: all } = await sb.from("members").select("user_id,display_name").eq("household_id", m.household_id);
  S.names = Object.fromEntries((all||[]).map(x => [x.user_id, x.display_name]));
  await loadTrip(); await loadList();
  startRt();
  render();
}

async function loadList() {
  const { data } = await sb.from("shopping_list").select("*").eq("household_id", S.me.household_id).order("created_at");
  S.list = data || [];
}

async function loadTrip() {
  const { data: t } = await sb.from("trips").select("*").eq("household_id", S.me.household_id).eq("status","open").order("started_at",{ascending:false}).limit(1).maybeSingle();
  S.trip = t || null;
  S.items = [];
  if (t) { const { data } = await sb.from("items").select("*").eq("trip_id", t.id).order("created_at"); S.items = data || []; }
}

function startRt() {
  stopRt();
  S.rt = sb.channel("hh").on("postgres_changes", { event:"*", schema:"public", table:"items", filter:`household_id=eq.${S.me.household_id}` }, onRt)
    .on("postgres_changes", { event:"*", schema:"public", table:"trips", filter:`household_id=eq.${S.me.household_id}` }, onRt)
    .on("postgres_changes", { event:"*", schema:"public", table:"shopping_list", filter:`household_id=eq.${S.me.household_id}` }, onRt).subscribe();
}
function stopRt() { if (S.rt) { sb.removeChannel(S.rt); S.rt = null; } }
let rtTimer;
function onRt() {
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async () => { if (S.sheet) return; await loadTrip(); await loadList(); S.stats = null; if (S.tab === "spesa" || S.tab === "lista") render(); }, 300);
}

function renderAuth(mode = "login", msg = "") {
  root().innerHTML = `<div class="wrap" style="padding-top:60px">
    <div style="text-align:center;font-size:56px">🛒</div><h1 style="text-align:center">Spesa</h1>

      <label>Email</label><input id="em" type="email" autocomplete="email" inputmode="email">

      <div class="err" id="msg">${esc(msg)}</div>
      <button class="btn" id="go">${mode==="signup"?"Crea account":"Entra"}</button>
      <p style="text-align:center;margin:14px 0 0"><a href="#" id="sw">${mode==="signup"?"Ho già un account":"Non ho un account"}</a></p>
    </div></div>`;
  $("#sw").onclick = e => { e.preventDefault(); renderAuth(mode === "signup" ? "login" : "signup"); };
  $("#go").onclick = async () => {
    const email = $("#em").value.trim(), password = $("#pw").value;
    $("#go").disabled = true;

}
function tr(m) {
  if (/Invalid login/i.test(m)) return "Email o password errati.";
  if (/already registered/i.test(m)) return "Email già registrata: usa Entra.";
  if (/Password should/i.test(m)) return "Password troppo corta (minimo 6 caratteri).";
  if (/not confirmed/i.test(m)) return "Conferma prima l'email dal link che ti è arrivato.";
  return m;
}

function finishTrip() {
  S.sheet = true;
  let bg = $(".sheet-bg"); if (!bg) { bg = document.createElement("div"); bg.className = "sheet-bg"; document.body.appendChild(bg); }
  const close = () => { S.sheet = false; bg.remove(); };
  const total = tripTotal(), saved = tripSaved();
  const home = (err) => {
    bg.innerHTML = `<div class="sheet"><b style="font-size:19px">Termina la spesa</b>
      <div class="mute" style="margin-bottom:10px">${esc(S.trip.store_name)} · ${S.items.length} prodotti</div>

      <button class="btn sec" id="x" style="margin-top:8px">Annulla</button></div>`;
    bg.querySelector("#x").onclick = close;
    bg.querySelector("#f2").onclick = async () => { bg.querySelector("#f2").disabled = true; close(); await doFinish(); };
    bg.querySelector("#rc").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) readReceipt(f); };
  };
  const readReceipt = async file => {
    bg.innerHTML = `<div class="sheet" style="text-align:center;padding:36px 24px"><div class="scanbox" style="height:150px"><div class="laser"></div></div><p class="dots" style="margin:0 0 16px">Leggo lo scontrino</p><button class="btn sec" id="x">Annulla</button></div>`;
    bg.querySelector("#x").onclick = close;

      if (error) throw error;
      if (data?.error) throw new Error(data.error);
      if (!$(".sheet-bg")) return;
      const c = compareReceipt(data);

      bg.querySelector("#back").onclick = close;
      bg.querySelector("#ok").onclick = async () => { bg.querySelector("#ok").disabled = true; close(); await doFinish({ receipt_total: c.rTotal, receipt_discount: c.rDisc, receipt_checked_at: new Date().toISOString() }); };
    } catch (e) {
      let m = e.message || String(e);
      try { const j = await e.context?.json?.(); if (j?.error) m = j.error; } catch {}
      if ($(".sheet-bg")) home("Non sono riuscito a leggere lo scontrino (" + m + "). Riprova con una foto più nitida o termina senza.");
    }
  };
  home();
}

// ---------- scansione ----------
function resizeToB64(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const d = c.toDataURL("image/jpeg", 0.82); res({ b64: d.split(",")[1], url: d });
    };
    img.onerror = rej; img.src = url;
  });
}

async function scan(file) {
  openSheet({}, false, true);
  try {
    const { b64, url } = await resizeToB64(file);
    const { data, error } = await sb.functions.invoke("scan-label", { body: { image: b64, mediaType: "image/jpeg" } });
    if (error) throw error;
    if (data?.error) throw new Error(data.error);
    const su = UNIT_BASE[data.size_unit] ? data.size_unit : null;
    openSheet({ name: data.name, category: data.category, unit_price: data.unit_price, discount: data.discount, qty: data.qty || 1, size_value: numN(data.size_value), size_unit: su, _lp: numN(data.label_ppu), _lpu: data.label_ppu_unit, _tp: numN(data.typical_price), _thumb: url, _conf: data.confidence });
  } catch (e) {
    let m = e.message || String(e);
    try { const j = await e.context?.json?.(); if (j?.error) m = j.error; } catch {}
    openSheet({ _err: "Non sono riuscito a leggere l'etichetta (" + m + "). Compila a mano." });
  }
}

function openSheet(it, editing = false, loading = false) {
  S.sheet = true;
  let bg = $(".sheet-bg"); if (!bg) { bg = document.createElement("div"); bg.className = "sheet-bg"; document.body.appendChild(bg); }
  const close = () => { S.sheet = false; bg.remove(); };
  if (loading) { bg.innerHTML = `<div class="sheet" style="text-align:center;padding:36px 24px"><div class="scanbox"><div class="laser"></div></div><p class="dots" style="margin:0 0 16px">Leggo l'etichetta</p><button class="btn sec" id="x">Annulla</button></div>`; bg.querySelector("#x").onclick = close; return; }
  const q = it.qty ?? 1;
  bg.innerHTML = `<div class="sheet">
    <div class="row">${it._thumb ? `<img class="thumb" src="${it._thumb}">` : ""}<div class="sp"><b>${editing ? "Modifica prodotto" : "Conferma prodotto"}</b>
      ${it._conf != null && it._conf < 0.6 ? `<div class="mute" style="color:var(--warn)">Lettura incerta: controlla i dati</div>` : ""}</div></div>
    ${it._err ? `<div class="err">${esc(it._err)}</div>` : ""}
    <label>Prodotto</label><input id="n" value="${esc(it.name || "")}" placeholder="Nome prodotto">
    <label>Categoria</label><select id="c">${CATS.map(c => `<option value="${esc(c)}" ${c === (it.category || "Altro") ? "selected" : ""}>${catM(c)[0]}  ${esc(c)}</option>`).join("")}</select>
    <div class="row"><div class="sp"><label>Prezzo unitario (€)</label><input id="p" inputmode="decimal" value="${it.unit_price ?? ""}"></div>
      <div class="sp"><label>Sconto per pezzo (€)</label><input id="d" inputmode="decimal" value="${it.discount || ""}" placeholder="0"></div></div>
    <div class="row"><div class="sp"><label>Formato (peso o volume)</label><input id="sv" inputmode="decimal" value="${it.size_value ?? ""}" placeholder="es. 500"></div>
      <div class="sp"><label>Unità</label><select id="su"><option value="">—</option>${["g", "kg", "ml", "cl", "l", "pz"].map(u => `<option ${u === it.size_unit ? "selected" : ""}>${u}</option>`).join("")}</select></div></div>
    <div id="insw"></div>
    <div class="row" style="margin-bottom:8px"><label class="sp">Quantità</label><div class="stepper"><button id="m">−</button><b id="qv">${q}</b><button id="pl">+</button></div></div>
    <div class="row" style="margin:6px 0 12px"><span class="sp mute">Totale riga</span><b id="lt" style="font-size:22px"></b></div>
    <button class="btn" id="ok">${editing ? "Salva" : "Aggiungi al carrello"}</button>
    ${editing ? `<button class="btn bad" id="del" style="margin-top:8px">Elimina</button>` : ""}
    <button class="btn sec" id="x" style="margin-top:8px">Annulla</button></div>`;
  let qty = q;
  const calc = () => Math.max(0, qty * num($("#p").value) - qty * num($("#d").value));
  const readF = () => ({ name: $("#n").value, unit_price: num($("#p").value), discount: num($("#d").value), size_value: numN($("#sv").value), size_unit: $("#su").value || null, lp: it._lp, lpu: it._lpu, tp: it._tp, id: it.id });
  const upd = () => { $("#qv").textContent = qty; $("#lt").textContent = eur(calc()); const w = $("#insw"); if (w) w.innerHTML = insightHtml(readF()); };
  ["#p", "#d", "#n", "#sv"].forEach(s => $(s).oninput = upd); $("#su").onchange = upd;
  const fireRecent = () => {
    if (!$("#insw") || editing || !it._thumb || !it.name) return;
    const r = recentInfo(it.name, it.id); if (!r) return;
    sfx("warn"); try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch {}
    toast("🔁 " + recentText(r));
  };
  if (!S.stats) getStats(true).then(() => { if ($("#insw")) { upd(); fireRecent(); } }); else fireRecent();
  $("#m").onclick = () => { qty = Math.max(1, qty - 1); upd(); };
  $("#pl").onclick = () => { qty += 1; upd(); };
  $("#x").onclick = close; upd();
  $("#ok").onclick = async () => {
    const f = readF(), pp = calcPpu(Math.max(0, f.unit_price - f.discount), f.size_value, f.size_unit, f.lp, f.lpu);
    const row = { name: $("#n").value.trim(), category: $("#c").value, unit_price: num($("#p").value), discount: num($("#d").value), qty,
      size_value: f.size_value > 0 && f.size_unit ? f.size_value : null, size_unit: f.size_value > 0 && f.size_unit ? f.size_unit : null,
      ppu: pp ? Math.round(pp.v * 10000) / 10000 : null, ppu_unit: pp ? pp.u : null };
    if (!row.name) return alert("Scrivi il nome del prodotto.");
    $("#ok").disabled = true; const before = tripTotal();
    const r = editing ? await sb.from("items").update(row).eq("id", it.id).select().single()

const ppuTxt = p => p ? `${eur(p.v)}/${p.u}` : "";

function recentInfo(name, excludeId) {

  (st ? st.items : []).forEach(i => { seen.add(i.id); all.push(i); });
  S.items.forEach(i => { if (!seen.has(i.id)) all.push(i); });

    <div class="bars" style="margin-top:12px">${list.map(x => `<div class="r"><div class="rt"><span class="rl">${esc(x.k)}</span><span class="t price" style="color:${x.d > 2 ? "var(--bad)" : x.d < -2 ? "var(--accent)" : "inherit"}">${fmtPct(x.d)}</span></div><div class="mute" style="font-size:12px">su ${x.n} prodott${x.n === 1 ? "o" : "i"}</div></div>`).join("")}</div>`;
  const gaps = rows.map(r => { const ks = Object.keys(r.avg).sort((a, b) => r.avg[a] - r.avg[b]), lo = ks[0], hi = ks[ks.length - 1];
    return { name: r.name, lo, hi, vl: r.avg[lo], vh: r.avg[hi], suf: r.suf, g: (r.avg[hi] / r.avg[lo] - 1) * 100 }; }).filter(g => g.g > 3).sort((a, b) => b.g - a.g).slice(0, 5);
  if (gaps.length) html += `<div class="mute" style="margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em">Maggiori differenze</div>` + gaps.map(g => `<div style="margin:10px 0"><div class="row"><div class="sp"><b>${esc(g.name)}</b></div><span class="cat" style="--h:20">+${g.g.toFixed(0)}%</span></div><div class="mute" style="font-size:13px">${esc(g.lo)} ${eur(g.vl)}${g.suf} · ${esc(g.hi)} ${eur(g.vh)}${g.suf}</div></div>`).join("");
  return html + `<p class="mute" style="font-size:12px;margin:12px 0 0">Il confronto usa il prezzo medio (al kg o al litro quando noto, già scontato) dei prodotti simili.</p></div>`;
}

async function viewAndamento() {
  const v = $("#view"); v.innerHTML = `<div class="wrap"><h1>Andamento</h1><p class="mute">Calcolo…</p></div>`;
  const st = await getStats(); if (!st) return;
  const tripOf = Object.fromEntries(st.trips.map(t => [t.id, t]));
  if (!st.items.length) return v.innerHTML = `<div class="wrap"><h1>Andamento</h1><p class="mute">Registra qualche spesa e qui compariranno i grafici.</p></div>`;
  // mesi
  const byM = {}; st.items.forEach(i => { const t = tripOf[i.trip_id]; if (!t) return; const k = t.started_at.slice(0, 7); byM[k] = (byM[k] || 0) + Number(i.total); });
  const months = Object.keys(byM).sort().slice(-6).map(k => [new Date(k + "-01").toLocaleDateString("it-IT", { month: "short", year: "2-digit" }), byM[k]]);
  // supermercati
  const byS = {};
  st.items.forEach(i => { const t = tripOf[i.trip_id]; if (!t) return; const s = byS[t.store_name] ??= { tot: 0, saved: 0, trips: new Set() }; s.tot += Number(i.total); s.saved += Number(i.discount) * Number(i.qty); s.trips.add(t.id); });
  const stores = Object.entries(byS).sort((a, b) => b[1].tot - a[1].tot);
  // categorie
  const byC = {}; st.items.forEach(i => byC[i.category] = (byC[i.category] || 0) + Number(i.total));
  const cats = Object.entries(byC).sort((a, b) => b[1] - a[1]);
  // totali
  const tot = st.items.reduce((a, i) => a + Number(i.total), 0), saved = st.items.reduce((a, i) => a + Number(i.discount) * Number(i.qty), 0);
  const nTrips = new Set(st.items.map(i => i.trip_id)).size;
  // prodotti ricorrenti
  const byP = {}; st.items.forEach(i => { const k = i.name.toLowerCase().trim(); (byP[k] ??= []).push(i); });
  const rec = Object.values(byP).filter(a => a.length >= 2 && a.some(x => Number(x.unit_price) > 0)).map(a => {
    const pr = a.map(x => Number(x.unit_price) - Number(x.discount)).filter(p => p > 0); const last = a[a.length - 1];
    const lastP = Number(last.unit_price) - Number(last.discount), avg = pr.reduce((x, y) => x + y, 0) / pr.length;
    const min = a.reduce((m, x) => (Number(x.unit_price) - Number(x.discount)) < (Number(m.unit_price) - Number(m.discount)) ? x : m);
    return { name: last.name, n: a.length, lastP, avg, minP: Number(min.unit_price) - Number(min.discount), minStore: tripOf[min.trip_id]?.store_name || "", lastStore: tripOf[last.trip_id]?.store_name || "" };
  }).sort((a, b) => b.n - a.n).slice(0, 12);
  v.innerHTML = `<div class="wrap"><h1>Andamento</h1>
    <div class="card row" style="text-align:center"><div class="sp"><div class="mute">Speso</div><b style="font-size:20px">${eur(tot)}</b></div><div class="sp"><div class="mute">Spese</div><b style="font-size:20px">${nTrips}</b></div><div class="sp"><div class="mute">Media</div><b style="font-size:20px">${eur(tot / Math.max(nTrips, 1))}</b></div><div class="sp"><div class="mute">Risparmiato</div><b style="font-size:20px;color:var(--accent)">${eur(saved)}</b></div></div>
    <h2>Per mese</h2><div class="card">${bars(months)}</div>
    <h2>Per supermercato</h2><div class="card">${bars(stores.map(([n, s]) => [n, s.tot, `${s.trips.size} spese · media ${eur(s.tot / s.trips.size)} · sconti ${eur(s.saved)}`]))}</div>
    <h2>Per categoria</h2><div class="card">${catList(cats)}</div>
    ${rec.length ? `<h2>Prodotti che ricompri</h2><div class="card">${rec.map(r => { const d = r.lastP - r.avg; return `<div style="margin:8px 0"><div class="row"><div class="sp">${esc(r.name)} <span class="mute">×${r.n}</span></div><div class="price">${eur(r.lastP)} <span class="${d > 0.005 ? "up" : d < -0.005 ? "down" : "mute"}" style="font-size:12px">${d > 0.005 ? "▲" : d < -0.005 ? "▼" : "="} vs media ${eur(r.avg)}</span></div></div>
      <div class="mute" style="font-size:12px">Prezzo migliore ${eur(r.minP)}${r.minStore ? " da " + esc(r.minStore) : ""}</div></div>`; }).join("")}</div>` : ""}
  </div>`;
}

    <div class="mute">Account</div><div>${esc(S.user.email)}</div><div class="mute" style="margin-top:10px">Nome</div><div>${esc(S.me.display_name)}</div></div>
    <div class="card"><div class="mute">Gruppo “${esc(S.hh.name)}”</div>
    <div class="mute" style="margin-top:8px">Codice da dare al partner per entrare</div><div style="font-size:34px;font-weight:700;letter-spacing:.15em">${esc(S.hh.invite_code)}</div>
    <div class="mute" style="margin-top:8px">Membri: ${Object.values(S.names).map(esc).join(", ")}</div></div>
    <div class="card"><div class="row"><div class="sp"><div>Suoni</div><div class="mute">Effetti sonori quando aggiungi prodotti</div></div><button class="btn sm sec" id="snd">${pref.get("sound", true) ? "Attivi" : "Spenti"}</button></div>
    <div class="row" style="margin-top:12px"><div class="sp"><div>Budget spesa</div><div class="mute">Su questo dispositivo</div></div><button class="btn sm sec" id="bg">${pref.get("budget", 0) ? eur(pref.get("budget", 0)) : "Imposta"}</button></div></div>
    <button class="btn sec" id="lo">Esci</button></div>`;
  $("#snd").onclick = () => { pref.set("sound", !pref.get("sound", true)); viewProfilo(); sfx("add"); };
  $("#bg").onclick = askBudget;
  $("#lo").onclick = () => sb.auth.signOut();
}
